<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Apprentissage du cri avec Spike Prime</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f8ff;
        }
        h1, h2 {
            color: #2e8b57;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
        .lesson {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            background-color: white;
        }
        .question {
            margin: 10px 0;
        }
        .option {
            display: block;
            margin: 5px 0;
        }
        #feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        #nextBtn {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Apprentissage du cri avec LEGO Spike Prime</h1>
    <button id="connectBtn">Se connecter à Spike Prime</button>
    <button id="disconnectBtn" disabled>Déconnecter</button>
    <div id="status">Statut : Non connecté</div>

    <h2>Sélectionner une leçon</h2>
    <select id="lessonSelect">
        <option value="1">Leçon 1 : Alphabet - Voyelles (Facile)</option>
        <option value="2">Leçon 2 : Alphabet - Consonnes P, T, K (Facile)</option>
        <option value="3">Leçon 3 : Alphabet - Consonnes M, N, S (Facile)</option>
        <option value="4">Leçon 4 : Alphabet - Consonnes Y, L, CH (Facile)</option>
        <option value="5">Leçon 5 : Nombres (Facile)</option>
        <option value="6">Leçon 6 : Couleurs (Moyen)</option>
        <option value="7">Leçon 7 : Phrases simples (Difficile)</option>
    </select>
    <button id="startLessonBtn">Démarrer la leçon</button>

    <div id="lessonContent" style="display: none;">
        <div class="lesson">
            <h2 id="lessonTitle"></h2>
            <div id="lessonText"></div>
            <div id="quiz"></div>
            <div id="feedback"></div>
            <button id="nextBtn">Question suivante</button>
        </div>

                    },

                        options: ["ke", "ka", "ki", "ko"],

            },

                content: "Apprenez les consonnes M, N, et S : ᒪ = ma, ᒥ = mi, ᒧ = mo, ᒨ = me, ᓀ = na, ᓂ = ni, ᓄ = no, ᓅ = ne, ᓵ = sa, ᓯ = si, ᓱ = so, ᓲ = se.",

                        correct: 0,
                        explanation: "ᒧ = mo en cri."
                    },
                    {
                        question: "Quelle lettre est ᒨ en cri ?",
                        options: ["me", "ma", "mi", "mo"],
                        correct: 0,
                        explanation: "ᒨ = me en cri."
                    },
                    {
                        question: "Quelle lettre est ᓀ en cri ?",
                        options: ["na", "ni", "no", "ne"],
                        correct: 0,

                    },

                        question: "Quelle lettre est ᓂ en cri ?",
                        options: ["ni", "na", "no", "ne"],

                    },

                        options: ["no", "na", "ni", "ne"],

                    },

            4: {

                    },

                    },

                    },

                        question: "Quelle lettre est ᓗ en cri ?",
                        options: ["lo", "la", "li", "le"],
                        correct: 0,
                        explanation: "ᓗ = lo en cri."
                    },
                    {
                        question: "Quelle lettre est ᒋ en cri ?",
                        options: ["cha", "chi", "cho", "che"],
                        correct: 0,
                        explanation: "ᒋ = cha en cri."
                    },
                    {
                        question: "Quelle lettre est ᒌ en cri ?",
                        options: ["chi", "cha", "cho", "che"],

                    },

                        options: ["cho", "cha", "chi", "che"],

                        explanation: "ᒍ = cho en cri."
                    }
                ]
            },
            5: {
                title: "Nombres",
                content: "Apprenez les nombres de 1 à 5 en cri.",
                questions: [
                    {
                        question: "Comment dit-on '1' en cri ?",
                        options: ["Pêyak", "Nîso", "Nisto", "Yotân"],
                        correct: 0,
                        explanation: "Pêyak signifie un en cri."
                    },
                    {
                        question: "Comment dit-on '2' en cri ?",
                        options: ["Pêyak", "Nîso", "Nisto", "Yotân"],
                        correct: 1,
                        explanation: "Nîso signifie deux en cri."

                ]
            },
            6: {
                title: "Couleurs",
                content: "Apprenez les couleurs de base en cri.",
                questions: [
                    {
                        question: "Comment dit-on 'Rouge' en cri ?",
                        options: ["Miskwaa", "Oskâpêyak", "Kisâkihitin", "Wâpiskâw"],
                        correct: 0,

                        options: ["Bonjour, comment vas-tu ?", "Merci, au revoir", "Bonjour ami", "À plus tard"],
                        correct: 0,
                        explanation: "'Tânisi, kîkway' signifie 'Bonjour, comment vas-tu ?' en cri."

                    {
                        question: "Que signifie 'Mino ay-hay' ?",
                        options: ["Merci beaucoup", "Bonjour ami", "Bonne nuit", "Je t'aime"],
                        correct: 0,

        document.getElementById('connectBtn').addEventListener('click', connect);
        document.getElementById('disconnectBtn').addEventListener('click', disconnect);
        document.getElementById('startLessonBtn').addEventListener('click', startLesson);
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);

        async function connect() {
            try {
                console.log('Requesting Bluetooth device...');
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [LEGO_HUB_SERVICE] }]
                });

                console.log('Connecting to GATT server...');
                server = await device.gatt.connect();

                console.log('Getting service...');
                service = await server.getPrimaryService(LEGO_HUB_SERVICE);

                console.log('Getting characteristic...');
                characteristic = await service.getCharacteristic(LEGO_HUB_CHARACTERISTIC);

                document.getElementById('status').textContent = 'Statut : Connecté à ' + device.name;
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

            } catch (error) {
                console.error('Connection failed:', error);
                document.getElementById('status').textContent = 'Statut : Échec de la connexion - ' + error.message;
            }
        }

        async function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
            device = null;
            server = null;
            service = null;
            characteristic = null;
            document.getElementById('status').textContent = 'Statut : Déconnecté';
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
        }

        async function sendCommand(command) {
            if (!characteristic) {
                console.warn('Not connected to Spike Prime');
                return;
            }
            try {
                await characteristic.writeValue(new Uint8Array(command));
                console.log('Command sent:', command);
            } catch (error) {
                console.error('Failed to send command:', error);
            }
        }

        function startLesson() {
            const lessonId = document.getElementById('lessonSelect').value;
            currentLesson = lessons[lessonId];
            currentQuestionIndex = 0;
            document.getElementById('lessonTitle').textContent = currentLesson.title;
            document.getElementById('lessonText').textContent = currentLesson.content;
            document.getElementById('lessonContent').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            const question = currentLesson.questions[currentQuestionIndex];
            const quizDiv = document.getElementById('quiz');
            quizDiv.innerHTML = `<div class="question">${question.question}</div>`;
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'option';
                button.addEventListener('click', () => checkAnswer(index));
                quizDiv.appendChild(button);
            });
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function checkAnswer(selectedIndex) {
            const question = currentLesson.questions[currentQuestionIndex];
            const feedbackDiv = document.getElementById('feedback');
            if (selectedIndex === question.correct) {
                feedbackDiv.textContent = 'Correct ! ' + question.explanation;
                feedbackDiv.style.color = 'green';
                // Robot celebration: Motor A forward briefly
                sendCommand([0x81, 0x00, 0x11, 0x51, 0x00, 0x64]); // Start motor
                setTimeout(() => sendCommand([0x81, 0x00, 0x11, 0x51, 0x00, 0x00]), 1000); // Stop after 1s
            } else {
                feedbackDiv.textContent = 'Incorrect. ' + question.explanation;
                feedbackDiv.style.color = 'red';
                // Robot feedback: Motor A backward briefly
                sendCommand([0x81, 0x00, 0x11, 0x51, 0x00, 0x9C]); // Start backward
                setTimeout(() => sendCommand([0x81, 0x00, 0x11, 0x51, 0x00, 0x00]), 1000); // Stop after 1s
            }
            document.getElementById('nextBtn').style.display = 'inline';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentLesson.questions.length) {
                showQuestion();
            } else {
                document.getElementById('quiz').innerHTML = '<p>Leçon terminée ! Choisissez une autre leçon.</p>';
                document.getElementById('feedback').textContent = '';
                document.getElementById('nextBtn').style.display = 'none';
            }
        }
    </script>
</body>
</html>
