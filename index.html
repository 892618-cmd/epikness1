                        correct: 0,
                        explanation: "'Mi'kmaq bonjour rouge' s'écrit ᒥᒃᒪᒃ ᑫᓵᓗᓪ ᐧᐊᐯᒃ en symboles Mi'kmaq."

        document.getElementById('connectBtn').addEventListener('click', connect);
        document.getElementById('disconnectBtn').addEventListener('click', disconnect);
        document.getElementById('showWordBtn').addEventListener('click', () => {
            const language = languages[currentLanguageIndex];
            const state = languageState[language];
            if (!state.lesson) {
                document.getElementById('hubDisplay').textContent = 'Démarrez d\u00e9jà une leçon pour envoyer un mot.';
                return;
            }
            const question = state.lesson.questions[state.questionIndex];
            showWordOnHub(question.options[question.correct]);
        });
        
        document.getElementById('forgetBtn').addEventListener('click', forgetDevice);

        async function forgetDevice() {
            try {

                if (device && device.gatt.connected) {
                    device.gatt.disconnect();
                }

                // Remove browser permission/pairing
                await device.forget();

                device = null;
                server = null;
                service = null;
                characteristic = null;

                document.getElementById('status').textContent =
                    'Statut : Appareil supprimé';

                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;

                console.log("Device forgotten successfully");

            } catch (error) {
                console.error("Forget failed:", error);
            }
        }
        // Add event listeners for all start lesson buttons
        document.querySelectorAll('.startLessonBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const language = e.target.getAttribute('data-language');
                startLesson(language);
            });
        });
        
        // Add event listeners for all next buttons
        document.querySelectorAll('.nextBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const language = e.target.id.split('-')[1];
                nextQuestion(language);
            });
        });

        // Store current lesson state for each language
        const languageState = {
            'cri': { lesson: null, questionIndex: 0 },
            'mohawk': { lesson: null, questionIndex: 0 },
            'navajo': { lesson: null, questionIndex: 0 },
            'inuktitut': { lesson: null, questionIndex: 0 },
            'mikmaq': { lesson: null, questionIndex: 0 }
        };

        const languages = ['cri', 'mohawk', 'navajo', 'inuktitut', 'mikmaq'];
        const languageNames = {
            cri: 'Cree',
            mohawk: 'Mohawk',
            navajo: 'Navajo',
            inuktitut: 'Inuktitut',
            mikmaq: 'Mi\'kmaq'
        };
        let currentLanguageIndex = 0;

        function updateLanguageNav() {
            const language = languages[currentLanguageIndex];
            document.getElementById('selectedLanguageLabel').textContent = `Langue : ${languageNames[language]}`;
            const section = document.getElementById('lessonSelect-' + language).closest('.language-section');
            if (section) {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                document.querySelectorAll('.language-section').forEach(sec => {
                    sec.classList.toggle('active-section', sec === section);
                });
            }
        }

        document.getElementById('prevLanguage').addEventListener('click', () => {
            currentLanguageIndex = (currentLanguageIndex - 1 + languages.length) % languages.length;
            updateLanguageNav();
        });

        document.getElementById('nextLanguage').addEventListener('click', () => {
            currentLanguageIndex = (currentLanguageIndex + 1) % languages.length;
            updateLanguageNav();
        });

        updateLanguageNav();

        async function connect() {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'LEGO' },
                        { namePrefix: 'SPIKE' },
                        { namePrefix: 'Robert' },
                        { namePrefix: 'robert' }
                    ],
                    optionalServices: [LEGO_HUB_SERVICE]
                });

                device.addEventListener('gattserverdisconnected', onHubDisconnected);

                server = await device.gatt.connect();

                service = await server.getPrimaryService(LEGO_HUB_SERVICE);
                characteristic = await service.getCharacteristic(LEGO_HUB_CHARACTERISTIC);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleHubNotification);

                document.getElementById('status').textContent =
                    'Statut : Connecté à ' + device.name;

                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('showWordBtn').disabled = false;

                showWordOnHub('apprendre un langue');

            } catch (error) {
                console.error('Connection failed:', error);
                document.getElementById('status').textContent =
                    'Statut : Échec de la connexion - ' + error.message;
            }
        }

        async function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
            cleanupHubConnection();
        }

        function onHubDisconnected() {
            cleanupHubConnection();
            document.getElementById('status').textContent = 'Statut : Hub déconnecté';
        }

        function cleanupHubConnection() {
            device = null;
            server = null;
            service = null;
            characteristic = null;
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('showWordBtn').disabled = true;
        }

        function handleHubNotification(event) {
            const bytes = new Uint8Array(event.target.value.buffer);
            console.log('Hub notification:', Array.from(bytes));
            // Right-button press handling will depend on the hub notification payload format.
            // Update the pattern below if your Spike Prime sends a different button event packet.
            const isRightButton = bytes.length > 0 && bytes[0] === 0x10;
            if (isRightButton) {
                currentLanguageIndex = (currentLanguageIndex + 1) % languages.length;
                updateLanguageNav();
                document.getElementById('hubDisplay').textContent =
                    'Langue changée sur le Hub : ' + languageNames[languages[currentLanguageIndex]];
            }
        }

        async function sendCommand(command) {
            if (!characteristic) {
                console.warn('Not connected to Spike Prime');
                return;
            }
            try {
                await characteristic.writeValue(new Uint8Array(command));
                console.log('Command sent:', command);
            } catch (error) {
                console.error('Failed to send command:', error);
            }
        }

        function runMotor(portMask, speed, duration = 1000) {
            // Port A = 0x01, Port B = 0x02 for LEGO Hub output ports
            sendCommand([0x81, 0x00, 0x11, 0x51, portMask, speed]);
            setTimeout(() => sendCommand([0x81, 0x00, 0x11, 0x51, portMask, 0x00]), duration);
        }

        async function showWordOnHub(text) {
            if (!characteristic) {
                console.warn('Not connected to Spike Prime');
                document.getElementById('hubDisplay').textContent = 'Connectez le Hub pour afficher un mot.';
                return;
            }

            const displayText = String(text).slice(0, 14);
            const encoder = new TextEncoder();
            const payload = Array.from(encoder.encode(displayText));
            // Use the hub advertising name property as a lightweight way to request text display.
            // Some Spike Prime hubs show short names on the LED matrix or internal status display.
            const command = [0x01, 0x01, 0x01, ...payload];

            await sendCommand(command);
            document.getElementById('hubDisplay').textContent = 'Affichage demandé au Hub : ' + displayText;
            document.getElementById('status').textContent = 'Statut : Envoi du mot au Hub — ' + displayText;
        }

        function startLesson(language) {
            const lessonId = document.getElementById('lessonSelect-' + language).value;
            languageState[language].lesson = lessons[lessonId];
            languageState[language].questionIndex = 0;
            const state = languageState[language];
            document.getElementById('lessonTitle-' + language).textContent = state.lesson.title;
            document.getElementById('lessonText-' + language).textContent = state.lesson.content;
            document.getElementById('lessonContent-' + language).style.display = 'block';
            showQuestion(language);
        }

        function showQuestion(language) {
            const state = languageState[language];
            const question = state.lesson.questions[state.questionIndex];
            const quizDiv = document.getElementById('quiz-' + language);
            quizDiv.innerHTML = `<div class="question">${question.question}</div>`;
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'option';
                button.addEventListener('click', () => checkAnswer(index, language));
                quizDiv.appendChild(button);
            });
            document.getElementById('feedback-' + language).textContent = '';
            document.getElementById('nextBtn-' + language).style.display = 'none';
        }

        function checkAnswer(selectedIndex, language) {
            const state = languageState[language];
            const question = state.lesson.questions[state.questionIndex];
            const feedbackDiv = document.getElementById('feedback-' + language);
            const selectedWord = question.options[selectedIndex];
            const correctWord = question.options[question.correct];

            if (selectedIndex === question.correct) {
                feedbackDiv.textContent = 'Correct ! ' + question.explanation;
                feedbackDiv.style.color = 'green';
                // Correct answer: raise motor on Port B
                runMotor(0x02, 0x64, 1000);
                showWordOnHub(correctWord);
            } else {
                feedbackDiv.textContent = 'Incorrect. ' + question.explanation;
                feedbackDiv.style.color = 'red';
                // Wrong answer: raise motor on Port A
                runMotor(0x01, 0x64, 1000);
                showWordOnHub(correctWord);
            }
            document.getElementById('nextBtn-' + language).style.display = 'inline';
        }

        function nextQuestion(language) {
            const state = languageState[language];
            state.questionIndex++;
            if (state.questionIndex < state.lesson.questions.length) {
                showQuestion(language);
            } else {
                document.getElementById('lessonContent-' + language).style.display = 'none';
                document.getElementById('quiz-' + language).innerHTML = '<p>Leçon terminée ! Choisissez une autre leçon.</p>';
                document.getElementById('feedback-' + language).textContent = '';
                document.getElementById('nextBtn-' + language).style.display = 'none';
            }
        }
    </script>
