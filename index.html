<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epikness - LEGO SPIKE Prime</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#667eea;
    color:white;
    text-align:center;
    padding:30px;
}

.container{
    background:white;
    color:black;
    max-width:800px;
    margin:auto;
    border-radius:15px;
    padding:30px;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

#status{
    margin-top:20px;
    padding:12px;
    background:#f0f0f0;
    border-radius:10px;
    color:black;
}

#currentLanguage{
    font-size:32px;
    margin-top:30px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Epikness</h1>

<h2>LEGO SPIKE Prime Language Selector</h2>

<button id="connectBtn">Connect to Robert</button>
<button id="disconnectBtn">Disconnect</button>

<div id="status">Status: Not connected</div>

<div id="currentLanguage">Cri</div>

</div>

<script>

let device = null;
let server = null;
let service = null;
let characteristic = null;

const LEGO_HUB_SERVICE =
    '00001623-1212-efde-1623-785feabcd123';

const LEGO_HUB_CHARACTERISTIC =
    '00001624-1212-efde-1623-785feabcd123';

const languages = [
    "Cri",
    "Mohawk",
    "Navajo",
    "Inuktitut",
    "Mi'kmaq"
];

let selectedLanguageIndex = 0;

document.getElementById('connectBtn')
    .addEventListener('click', connect);

document.getElementById('disconnectBtn')
    .addEventListener('click', disconnect);

function updateLanguageDisplay(){

    const language =
        languages[selectedLanguageIndex];

    document.getElementById('currentLanguage')
        .textContent = language;

    speakText(language);

    showLanguageOnHub(language);
}

function speakText(text){

    if(!('speechSynthesis' in window)){
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
}

async function connect(){

    try{

        device =
            await navigator.bluetooth.requestDevice({
                filters: [
                    { name: 'Robert' }
                ],
                optionalServices: [
                    LEGO_HUB_SERVICE
                ]
            });

        server =
            await device.gatt.connect();

        service =
            await server.getPrimaryService(
                LEGO_HUB_SERVICE
            );

        characteristic =
            await service.getCharacteristic(
                LEGO_HUB_CHARACTERISTIC
            );

        document.getElementById('status')
            .textContent =
            'Connected to ' + device.name;

        console.log("Connected!");

        updateLanguageDisplay();

        await characteristic.startNotifications();

        characteristic.addEventListener(
            'characteristicvaluechanged',
            handleHubNotification
        );

    }
    catch(error){

        console.error(error);

        document.getElementById('status')
            .textContent =
            'Connection failed - ' + error.message;
    }
}

function disconnect(){

    if(device && device.gatt.connected){
        device.gatt.disconnect();
    }

    document.getElementById('status')
        .textContent =
        'Disconnected';
}

function handleHubNotification(event){

    const value =
        new Uint8Array(event.target.value.buffer);

    console.log("Hub notification:", value);

    // RIGHT button simulation
    // adjust if needed based on actual values

    nextLanguage();
}

function nextLanguage(){

    selectedLanguageIndex++;

    if(selectedLanguageIndex >= languages.length){
        selectedLanguageIndex = 0;
    }

    updateLanguageDisplay();
}

async function showLanguageOnHub(text){

    if(!characteristic){
        return;
    }

    try{

        const encoder = new TextEncoder();

        const data =
            encoder.encode(text);

        await characteristic.writeValue(data);

        console.log("Sent to hub:", text);
    }
    catch(error){

        console.log(
            "Unable to display on hub:",
            error
        );
    }
}

</script>

</body>
</html>
